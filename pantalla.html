
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pantalla</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;}
  #img{width:100vw;height:100vh;object-fit:contain;display:block;}
  #vacio{color:#666;font-family:-apple-system,sans-serif;
          display:flex;align-items:center;justify-content:center;
          height:100vh;text-align:center;font-size:5vw;padding:0 5vw;}
  #error{position:fixed;bottom:8px;left:8px;color:#444;font:10px monospace;}
</style>
</head>
<body>
<div id="vacio">Conectando...</div>
<img id="img" style="display:none" alt="">
<div id="error"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

<script src="config.js"></script>
<script src="imagenes.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const refEstado = db.ref('estado');

let actual = null;

// Escucha cambios en tiempo real (instantaneo, sin polling)
refEstado.on('value', (snapshot) => {
  const data = snapshot.val();
  const nuevo = (data && data.actual) ? data.actual : "";
  if (nuevo !== actual) {
    actual = nuevo;
    const img = document.getElementById('img');
    const vacio = document.getElementById('vacio');
    const encontrada = IMAGENES.find(x => x.nombre === actual);
    if (encontrada) {
      img.src = encontrada.datos;
      img.style.display = 'block';
      vacio.style.display = 'none';
    } else {
      img.style.display = 'none';
      vacio.style.display = 'flex';
      vacio.textContent = 'Esperando seleccion...';
    }
  }
  document.getElementById('error').textContent = '';
}, (error) => {
  document.getElementById('error').textContent = 'err: ' + error.message;
});

// Mantener despierta la pantalla del iPad
async function mantenerDespierto(){
  try{
    if('wakeLock' in navigator){
      await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
document.addEventListener('click', mantenerDespierto, {once:true});
</script>
</body>
</html>
