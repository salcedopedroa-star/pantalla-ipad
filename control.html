
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Control</title>
<style>
  :root{ color-scheme: dark; }
  body{margin:0;background:#111;color:#eee;
       font-family:-apple-system,BlinkMacSystemFont,sans-serif;
       padding:18px;-webkit-user-select:none;user-select:none;}
  h1{font-size:20px;margin:0 0 4px;}
  p.sub{color:#888;font-size:13px;margin:0 0 18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .card{background:#1d1d1f;border:2px solid transparent;border-radius:14px;
        overflow:hidden;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;}
  .card:active{transform:scale(.96);}
  .card.sel{border-color:#0a84ff;}
  .card img{width:100%;height:110px;object-fit:cover;display:block;background:#000;}
  .card .name{padding:8px 10px;font-size:13px;white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis;text-transform:capitalize;}
  .vaciar{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;
          background:#333;color:#eee;font-size:15px;cursor:pointer;}
  .vaciar:active{background:#444;}
  #estado{margin-top:14px;font-size:12px;color:#666;text-align:center;min-height:16px;}
  .aviso{margin-top:8px;font-size:11px;color:#666;text-align:center;}
</style>
</head>
<body>
<h1>Control de pantalla</h1>
<p class="sub">Toca una imagen para mostrarla en el iPad.</p>
<div class="grid" id="grid"></div>
<button class="vaciar" onclick="seleccionar('')">Mostrar nada (pantalla en espera)</button>
<div id="estado"></div>
<div class="aviso">⏱ El iPad tarda hasta 1 minuto en actualizarse</div>

<script src="config.js"></script>
<script src="imagenes.js"></script>
<script>
let actual = null;

function pintar(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(!IMAGENES.length){
    grid.innerHTML = '<p style="color:#888">No hay imagenes definidas.</p>';
    return;
  }
  IMAGENES.forEach(img => {
    const card = document.createElement('div');
    card.className = 'card' + (img.nombre === actual ? ' sel' : '');
    card.onclick = () => seleccionar(img.nombre);
    card.innerHTML =
      `<img src="${img.datos}" alt="">` +
      `<div class="name">${img.nombre}</div>`;
    grid.appendChild(card);
  });
}

async function leerEstado(){
  try{
    const r = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}/latest`, {
      headers: { "X-Master-Key": CONFIG.masterKey, "X-Bin-Meta": "false" }
    });
    const d = await r.json();
    actual = (d && d.actual) ? d.actual : "";
    document.getElementById('estado').textContent = actual ? `Mostrando: ${actual}` : 'Pantalla en espera';
    pintar();
  }catch(e){
    document.getElementById('estado').textContent = 'Error: ' + e.message;
  }
}

async function seleccionar(nombre){
  actual = nombre;
  pintar();
  document.getElementById('estado').textContent = nombre ? `Cambiando a: ${nombre}...` : 'Apagando...';
  try{
    const r = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": CONFIG.masterKey
      },
      body: JSON.stringify({ actual: nombre })
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    document.getElementById('estado').textContent = nombre ? `Enviado: ${nombre}` : 'Apagado enviado';
  }catch(e){
    document.getElementById('estado').textContent = 'Error: ' + e.message;
  }
}

// Solo lee el estado al cargar la pagina, no en bucle (ahorra peticiones)
leerEstado();
</script>
</body>
</html>
